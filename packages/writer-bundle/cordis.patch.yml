# writer-bundle 组合层：按依赖序挂载全部 writer 插件。
# writer-core 是纯契约包（抽象基类 + 事件声明，无 apply），不出现在插件行，仅作依赖安装。
# writer-store 的 projectRoot 默认取 dsh 启动目录下的 novel/ 子目录（轮次 18 布局）；
# 在更高层（profile/home/overlay patch）以 `- id: writer-store` + 完整 config 覆写本行即可指向
# 实际小说项目（loader 方言：id 命中行的 config 整体替换不深合并；本行 config 仅 projectRoot 一项，
# 覆写无连带损失——与 preset 行不同，本包各行都是顶层行，可被外层 patch 按 id 直接寻址）。
- insert:
    - id: writer-store
      name: dsh-writer-store
      config:
        projectRoot: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'novel')
    # 写作引擎：provider/model 是部署相关可调参数，此处给 deepseek 官方路由默认值；
    # 更高层（profile/home/overlay patch）以 `- id: writer-engine` + 完整 config 覆写（整体替换）。
    - id: writer-engine
      name: dsh-writer-engine
      config:
        provider: deepseek-official
        model: deepseek-chat
    - id: writer-skills
      name: dsh-writer-skills
    # 导出（TXT/HTML/ePub）：tools 经 ctx.get 可选消费，缺席时 export_book 返回「导出未启用」，
    # 可独立禁用（从本清单移除即可）不阻塞核心写作。
    - id: writer-export
      name: dsh-writer-export
    # 混合检索（P4）：engine/tools 经 ctx.get 可选消费，缺席即检索增强关闭；
    # embeddingBackend 默认 none（仅关键词），更高层 patch 以 `- id: writer-rag` + 完整 config 覆写切档。
    - id: writer-rag
      name: dsh-writer-rag
      config:
        embeddingBackend: none
    # 业务错误预算（P4）：tools/post-execute 观测，只注入纠偏提示不熔断；移除本行即关闭。
    - id: writer-guard
      name: dsh-writer-guard
    - id: writer-tools
      name: dsh-writer-tools
