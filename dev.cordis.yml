# writer-in-dsh 本地开发 overlay（npx @deepseek-ai/dsh web --patch ./dev.cordis.yml）
# 路径必须绝对（loader 约定）。
- insert:
    - id: writer-store
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-store/src/index.ts'
      config:
        projectRoot: 'C:/Users/earne/workspace/writer-in-dsh/example-project'
    - id: writer-engine
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-engine/src/index.ts'
      config:
        provider: deepseek-official
        model: deepseek-chat
    - id: writer-skills
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-skills/src/index.ts'
    - id: writer-export
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-export/src/index.ts'
    - id: writer-rag
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-rag/src/index.ts'
      config:
        embeddingBackend: none
    - id: writer-guard
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-guard/src/index.ts'
      config:
        windowSize: 5
        failureBudget: 0.3
    - id: writer-tools
      name: 'C:/Users/earne/workspace/writer-in-dsh/packages/writer-tools/src/index.ts'
